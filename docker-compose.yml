services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartdesk}
      POSTGRES_DB: ${POSTGRES_DB:-smartdesk}
    # No host port: the database lives on the isolated `internal` network.
    # Use `docker compose exec postgres psql -U smartdesk` for ad-hoc access.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: backend
    command: sh -c "npm run migrate -w backend && npm run dev -w backend"
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-smartdesk}:${POSTGRES_PASSWORD:-smartdesk}@postgres:5432/${POSTGRES_DB:-smartdesk}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:-change-me-dev-only-change-me-dev-only}
      JWT_ISSUER: ${JWT_ISSUER:-smartdesk-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-smartdesk-web}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - '${BACKEND_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, public]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-smartdesk}:${POSTGRES_PASSWORD:-smartdesk}@postgres:5432/${POSTGRES_DB:-smartdesk}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: frontend
    environment:
      # Resolved by the browser, so it must be reachable from the host.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    networks: [public]

volumes:
  pgdata:

networks:
  internal:
    internal: true
  public:
