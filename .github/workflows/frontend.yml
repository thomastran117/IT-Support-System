name: frontend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: frontend / verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      # The e2e suite runs against the production build and never needs the API.
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Build shared packages
        run: npm run build -w packages/contracts 2>&1 | tee ci-build-shared.log

      - name: Lint
        run: npm run lint -w frontend 2>&1 | tee ci-lint.log

      - name: Typecheck
        run: npm run typecheck -w frontend 2>&1 | tee ci-typecheck.log

      - name: Unit tests
        run: npm run test:unit -w frontend 2>&1 | tee ci-test-unit.log

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (builds and serves the app)
        run: npm run test:e2e -w frontend 2>&1 | tee ci-test-e2e.log

      - name: Upload Playwright report and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ci-logs
          path: |
            ci-*.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
