name: backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Repository format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile ci run --rm --build format-check

  core:
    name: Backend, worker, and database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile ci run --rm --build backend-ci 2>&1 | tee ci-backend.log
      - name: Upload backend-ci-logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-logs
          path: ci-backend.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop containers
        if: always()
        run: docker compose --profile ci down -v

  gateway:
    name: Gateway contracts and network isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Gateway checks
        run: |
          docker compose run --rm --no-deps --build gateway npm test 2>&1 | tee ci-gateway.log
          docker compose -f docker-compose.modular.yml config --format json | jq -e '
            (.services.backend.ports // [] | length == 0) and
            (.services.gateway.ports | length == 1) and
            (.networks.api.internal == true) and
            (.services | to_entries | map(select(.value.networks // {} | has("api")) | .key) | sort == ["backend", "gateway"])
          '
      - name: Upload gateway-ci-logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-ci-logs
          path: ci-gateway.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop containers
        if: always()
        run: docker compose down -v

  lifecycle:
    name: Service lifecycle (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          [
            service-containers,
            notifications-service,
            analytics-service,
            knowledge-service,
            identity-service,
            ticket-service,
            default-compose,
          ]
    steps:
      - uses: actions/checkout@v4
      - name: Run lifecycle suite
        env:
          SUITE: ${{ matrix.suite }}
        run: sh "docker/verify-$SUITE.sh" 2>&1 | tee "ci-$SUITE.log"
      - name: Upload lifecycle-${{ matrix.suite }}-logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-${{ matrix.suite }}-logs
          path: ci-*.log
          if-no-files-found: ignore
          retention-days: 7

  search:
    name: OpenSearch profiles and integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Optional OpenSearch smoke check
        run: |
          default_services=$(docker compose config --services)
          if grep -Exq 'opensearch|hybrid-knowledge-experiment' <<< "$default_services"; then
            echo 'OpenSearch and the hybrid experiment must require explicit profiles.' >&2
            exit 1
          fi
          docker compose --profile search config --format json | jq -e '
            (.services.opensearch.ports // [] | length == 0) and
            (.services.opensearch.networks | keys == ["search"]) and
            (.networks.search.internal == true) and
            (.services.frontend.networks | has("search") | not) and
            (.services.frontend.environment | keys | all(startswith("OPENSEARCH_") | not))
          '
          docker compose --profile hybrid-experiment config --format json | jq -e '
            .services["hybrid-knowledge-experiment"] as $experiment |
            (($experiment.ports // []) | length == 0) and
            ($experiment.networks | keys == ["internal", "search"]) and
            (.networks.internal.internal == true) and (.networks.search.internal == true)
          '
          if [ "$(sysctl -n vm.max_map_count)" -lt 262144 ]; then
            sudo sysctl -w vm.max_map_count=262144
          fi
          docker compose --profile ci --profile search up -d --wait --wait-timeout 180 postgres-ci redis-ci opensearch

      - name: Build the test image and migrate the fresh database
        run: docker compose --profile ci --profile search run --rm --no-deps --build -w /app/backend backend-ci npm run migrate

      - name: OpenSearch mapping, worker, and rebuild integration tests
        run: |
          docker compose --profile ci --profile search run --rm --no-deps \
            -e TEST_OPENSEARCH_URL=http://opensearch:9200/ -w /app/backend backend-ci \
            ./node_modules/.bin/vitest run --no-file-parallelism \
            test/integration/openSearch.integration.test.ts test/integration/searchIndexOpenSearch.integration.test.ts \
            test/integration/searchRebuildOpenSearch.integration.test.ts test/integration/ticketSearchApi.integration.test.ts \
            test/integration/knowledgeOpenSearch.integration.test.ts test/integration/searchEvaluation.integration.test.ts \
            test/integration/hybridKnowledge.integration.test.ts \
            2>&1 | tee ci-search-tests.log

      - name: Collect OpenSearch logs on failure
        if: failure()
        run: docker compose --profile search logs --no-color opensearch > ci-opensearch.log
      - name: Upload backend-search-logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-search-logs
          path: ci-*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop containers
        if: always()
        run: docker compose --profile ci --profile search down -v

  verify:
    name: backend / verify
    runs-on: ubuntu-latest
    needs: [format, core, gateway, lifecycle, search]
    if: always()
    steps:
      - name: Require all backend jobs to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
