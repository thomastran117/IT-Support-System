name: backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: backend / verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build verification images
        run: docker compose --profile ci build format-check backend-ci

      - name: Format check
        run: set -o pipefail; docker compose --profile ci run --rm format-check 2>&1 | tee ci-format.log

      - name: Backend, worker and database checks
        run: set -o pipefail; docker compose --profile ci run --rm backend-ci 2>&1 | tee ci-backend.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-ci-logs
          path: ci-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop containers
        if: always()
        run: docker compose --profile ci down -v
