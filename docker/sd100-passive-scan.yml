env:
  contexts:
    - name: smartdesk-compose
      urls: [http://app.smartdesk.test:3100, http://api.smartdesk.test:4000]
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true
jobs:
  - type: passiveScan-config
    parameters:
      scanOnlyInScope: true
  - type: requestor
    requests:
      - url: http://app.smartdesk.test:3100/login
        responseCode: 200
      - url: http://api.smartdesk.test:4000/health/live
        responseCode: 200
      - url: http://api.smartdesk.test:4000/api/auth/me
        responseCode: 401
      - url: http://api.smartdesk.test:4000/api/admin/reports/summary
        responseCode: 401
  - type: passiveScan-wait
    parameters:
      maxDuration: 2
  - type: report
    parameters:
      template: traditional-json
      reportDir: /tmp
      reportFile: passive-zap.json
      reportTitle: SmartDesk isolated Compose passive scan
