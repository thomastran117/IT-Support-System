services:
  microservice-semgrep:
    profiles: [microservice-static]
    image: semgrep/semgrep:1.150.0
    network_mode: none
    working_dir: /src
    volumes:
      - .:/src:ro

  microservice-audit:
    profiles: [microservice-static]
    image: node:22-alpine
    working_dir: /src
    volumes:
      - .:/src:ro

  # SD-065: committed-secret scan over the full Git history (findings are redacted).
  microservice-gitleaks:
    profiles: [microservice-static]
    image: zricethezav/gitleaks:v8.28.0
    network_mode: none
    working_dir: /src
    volumes:
      - .:/src:ro
