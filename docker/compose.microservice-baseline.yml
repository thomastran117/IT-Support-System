services:
  backend:
    command: [sh, -ec, 'npm run build && exec node dist/server.js']
    environment:
      DATABASE_URL: postgres://smartdesk:smartdesk@postgres:5432/sd100_legacy

  worker:
    command: [sh, -ec, 'npm run build && exec node dist/worker.js']
    environment:
      DATABASE_URL: postgres://smartdesk:smartdesk@postgres:5432/sd100_legacy
