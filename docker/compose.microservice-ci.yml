services:
  frontend-ci:
    profiles: [microservice-ci]
    command:
      - sh
      - -ec
      - |
        node /app/docker/microservice-browser-relay.mjs &
        cd /app/frontend
        npm run build
        exec npm exec next start -- -p 3100 -H 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_TICKET_POLL_MS: '1000'
      E2E_BASE_URL: http://127.0.0.1:3100
      E2E_MICROSERVICE: 'true'
    networks: [public]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "Promise.all([fetch('http://127.0.0.1:3100/login'), fetch('http://127.0.0.1:4000/health/live')]).then(responses => process.exit(responses.every(r => r.ok) ? 0 : 1), () => process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      start_period: 90s
      retries: 12

  zap:
    profiles: [microservice-scan]
    image: ghcr.io/zaproxy/zaproxy:2.16.1
    networks: [public]
    volumes:
      - ./docker/sd100-passive-scan.yml:/zap/plan.yml:ro
    command: [sh, -ec, 'zap.sh -cmd -autorun /zap/plan.yml >&2 && cat /tmp/passive-zap.json']

  # SD-057: sustained 100-user benchmark against the public gateway (SD100_PERF=1).
  k6:
    profiles: [microservice-perf]
    image: grafana/k6:1.4.2
    # Writes its summary into the bind-mounted evidence directory owned by the CI user.
    user: '0:0'
    networks: [public]
    environment:
      GATEWAY_URL: http://gateway:4000
      TOKENS_FILE: /secrets/perf-tokens.json
      PERF_HOLD: ${PERF_HOLD:-5m}
    volumes:
      - ./tests/performance/k6:/scripts:ro
      - ./test-results/perf-secrets:/secrets:ro
      - ./test-results/sd100:/out
    command: [run, --quiet, /scripts/smartdesk.js]
