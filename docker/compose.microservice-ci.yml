services:
  gateway:
    networks:
      public:
        aliases: [api.smartdesk.test]
      api:

  frontend-ci:
    profiles: [microservice-ci]
    command:
      [sh, -ec, 'cd /app/frontend && npm run build && npm exec next start -- -p 3100 -H 0.0.0.0']
    environment:
      NEXT_PUBLIC_API_URL: http://api.smartdesk.test:4000
      NEXT_PUBLIC_TICKET_POLL_MS: '1000'
      E2E_BASE_URL: http://app.smartdesk.test:3100
      E2E_MICROSERVICE: 'true'
    networks:
      public:
        aliases: [app.smartdesk.test]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3100/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      start_period: 90s
      retries: 12

  zap:
    profiles: [microservice-scan]
    image: ghcr.io/zaproxy/zaproxy:2.16.1
    networks: [public]
    volumes:
      - ./docker/sd100-passive-scan.yml:/zap/plan.yml:ro
      - ./frontend/test-results/sd100:/zap/wrk
    command: [zap.sh, -cmd, -autorun, /zap/plan.yml]
